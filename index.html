  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

\"font-size:13px;line-height:1.6;color:#b9d3ea\">{{ openRow.note }}<\u002Fspan>\n          <\u002Fdiv>\n          <sc-if value=\"{{ openRow.rationale }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"grid-column:span 2;background:#0e1a2b;padding:14px 16px;display:flex;flex-direction:column;gap:5px\">\n              <span style=\"font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:#5fb8ff\">Grade rationale<\u002Fspan>\n              <span style=\"font-size:13px;line-height:1.6;color:#b9d3ea\">{{ openRow.rationale }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;align-items:center;gap:10px;padding:14px 16px\">\n          <a href=\"{{ openRow.link }}\" target=\"_blank\" rel=\"noopener\" style=\"display:flex;align-items:center;gap:9px;font-family:'Saira Condensed',sans-serif;font-weight:800;font-size:13px;letter-spacing:.14em;text-transform:uppercase;border:1px solid #1a8cff;background:linear-gradient(180deg,#1a8cff,#0a4f9e);color:#fff;padding:10px 16px;box-shadow:0 0 18px rgba(26,140,255,.6)\" style-hover=\"box-shadow:0 0 30px rgba(0,224,255,.9)\">▶ Play recording<\u002Fa>\n          <button sc-camel-on-click=\"{{ onModalDownload }}\" style=\"font-family:'Saira Condensed',sans-serif;font-weight:800;font-size:13px;letter-spacing:.14em;text-transform:uppercase;border:1px solid #33506f;background:linear-gradient(180deg,#1b2b42,#0d1626);color:#9fc4e8;padding:10px 16px;cursor:pointer\" style-hover=\"border-color:#00e0ff;color:#dceeff;box-shadow:0 0 16px rgba(0,224,255,.5)\">↓ Download<\u002Fbutton>\n          <div style=\"flex:1\"><\u002Fdiv>\n          <button sc-camel-on-click=\"{{ onModalToggle }}\" style=\"{{ openRow.modalToggleStyle }}\" style-hover=\"border-color:#00e0ff;color:#dceeff;box-shadow:0 0 16px rgba(0,224,255,.5)\">{{ openRow.toggleLabel }}<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ dl }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:60;pointer-events:none\">\n      <div style=\"width:420px;border:1px solid #7f93ab;border-top:1px solid #cfe0f5;background:linear-gradient(180deg,#131e30,#0a111d);box-shadow:0 26px 60px rgba(0,0,0,.55),0 0 60px rgba(0,224,255,.3);animation:zoomWin 160ms ease-out;pointer-events:auto\">\n        <div style=\"display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid #2b4463\">\n          <div style=\"width:8px;height:8px;border-radius:50%;background:#00e0ff;animation:dotPulse 1.2s ease-in-out infinite\"><\u002Fdiv>\n          <div style=\"font-family:'Saira Condensed',sans-serif;font-weight:800;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:#eaf4ff\">{{ dl.title }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:16px;display:flex;flex-direction:column;gap:13px\">\n          <div style=\"display:flex;align-items:center;gap:11px\">\n            <div style=\"width:26px;height:32px;border:1px solid #33506f;background:linear-gradient(180deg,#16233a,#0d1626);background-image:repeating-linear-gradient(to bottom,rgba(95,184,255,.5) 0 1px,transparent 1px 6px)\"><\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:3px;overflow:hidden\">\n              <span style=\"font-size:11.5px;color:#dceeff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ dl.file }}<\u002Fspan>\n              <span style=\"font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:#5c7897\">{{ dl.status }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"height:22px;border:1px solid #33506f;background:#080e18;padding:2px\">\n            <div style=\"{{ dl.fillStyle }}\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;align-items:center;justify-content:space-between\">\n            <span style=\"font-size:10px;letter-spacing:.14em;color:#7fb4e8;font-variant-numeric:tabular-nums\">{{ dl.pctLabel }}<\u002Fspan>\n            <button sc-camel-on-click=\"{{ onCancelDl }}\" style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;background:linear-gradient(180deg,#1b2b42,#0d1626);border:1px solid #33506f;color:#9fc4e8;padding:8px 13px;cursor:pointer\" style-hover=\"border-color:#00e0ff;color:#dceeff\">{{ dl.btnLabel }}<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;glow&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;high&quot;,&quot;low&quot;,&quot;off&quot;],&quot;default&quot;:&quot;high&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Look&quot;},&quot;ageAlertDays&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:60,&quot;min&quot;:7,&quot;max&quot;:180,&quot;step&quot;:1,&quot;unit&quot;:&quot;days&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Behavior&quot;}}\">\nconst CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRT6sX6uL-Rv_t-FCAzWGn96-OkhCFyF7ELzXlvDqYuIhvuR0_Cyr2akbbGxvm5alDTPopJf8IV9nmG/pub?gid=1317295187&single=true&output=csv';\nconst GRADES = ['A+','A','A-','B+','B','B-'];\nconst GRADE_RANK = {'A+':0,'A':1,'A-':2,'B+':3,'B':4,'B-':5};\nconst GRADE_NEON = {'A+':'#00e0ff','A':'#35b0ff','A-':'#5f8fe8','B+':'#f0a52a','B':'#c98a2a','B-':'#8a94a3'};\nconst WAVE_BARS = 40;\n\nfunction parseCsv(text){\n  var rows=[],row=[],f='',q=false;\n  for(var i=0;i<text.length;i++){var c=text[i];\n    if(q){if(c==='\"'&&text[i+1]==='\"'){f+='\"';i++;}else if(c==='\"')q=false;else f+=c;}\n    else if(c==='\"')q=true;else if(c===','){row.push(f);f='';}\n    else if(c==='\\n'){row.push(f);rows.push(row);row=[];f='';}\n    else if(c!=='\\r')f+=c;}\n  if(f.length||row.length){row.push(f);rows.push(row);}\n  return rows.filter(r=>r.length>1&&r.some(c=>c!==''));\n}\nfunction csvRowsToRecords(rows){\n  if (rows.length < 2) return [];\n  const header = rows[0].map(h => h.toLowerCase());\n  const idx = word => header.findIndex(h => h.indexOf(word) >= 0);\n  const col = { logged_at:0, link:idx('link'), agent:idx('agent'), date:idx('date'), ind:idx('industry'),\n    aud:idx('audience'), off:idx('offer'), grade:idx('grade'), note:idx('note'), duration:idx('duration'), rationale:idx('rationale') };\n  return rows.slice(1).map(r => ({\n    logged_at:r[col.logged_at]||'', link:r[col.link]||'', agent:r[col.agent]||'', date:r[col.date]||'',\n    ind:r[col.ind]||'', aud:r[col.aud]||'', off:r[col.off]||'', grade:r[col.grade]||'', note:r[col.note]||'',\n    duration:r[col.duration]||'', rationale:r[col.rationale]||'',\n  })).filter(r => r.link);\n}\nfunction loggedAtMs_(s){ const t = Date.parse(s||''); return isNaN(t) ? 0 : t; }\nfunction dedupeToChampions(records){\n  const byType = {};\n  records.forEach(r => {\n    const key = r.ind+'|||'+r.aud+'|||'+r.off;\n    const ex = byType[key];\n    if (!ex || (r.date||'') > (ex.date||'') || ((r.date||'')===(ex.date||'') && loggedAtMs_(r.logged_at) > loggedAtMs_(ex.logged_at))) byType[key] = r;\n  });\n  return Object.values(byType);\n}\nfunction driveFileId_(shareLink){\n  const m = String(shareLink||'').match(/\\/d\\/([a-zA-Z0-9_-]+)/) || String(shareLink||'').match(/[?&]id=([a-zA-Z0-9_-]+)/);\n  return m ? m[1] : null;\n}\nfunction drivePreviewUrl_(shareLink){\n  const id = driveFileId_(shareLink);\n  return id ? 'https://drive.google.com/file/d/'+id+'/preview' : null;\n}\nfunction driveDirectUrl_(shareLink){\n  const m = String(shareLink||'').match(/\\/d\\/([a-zA-Z0-9_-]+)/) || String(shareLink||'').match(/[?&]id=([a-zA-Z0-9_-]+)/);\n  return m ? 'https://drive.usercontent.google.com/download?id='+m[1]+'&export=download&authuser=0' : null;\n}\nfunction fmtDur_(s){\n  if (s === null || s === undefined || s === '' || isNaN(Number(s))) return null;\n  const n = Math.round(Number(s));\n  return Math.floor(n/60)+':'+String(n%60).padStart(2,'0');\n}\nfunction titleCase(s){ return String(s||'').toLowerCase().replace(/\\b\\w/g,c=>c.toUpperCase()); }\nfunction ageDays(dateStr){\n  if(!dateStr) return null;\n  const d = new Date(dateStr+'T00:00:00'); if (isNaN(d)) return null;\n  return Math.floor((Date.now()-d.getTime())/86400000);\n}\nfunction searchable(r){ return [r.ind,r.aud,r.off,r.agent,r.note].filter(Boolean).join(' ').toLowerCase(); }\nfunction fileName(r){\n  const last = (r.agent||'call').split(',')[0].trim().toLowerCase().replace(/[^a-z0-9]+/g,'-') || 'call';\n  const ind = (r.ind||'').toLowerCase().replace(/[^a-z0-9]+/g,'-');\n  return last+'_'+ind+'_'+(r.date||'')+'.mp3';\n}\nfunction hashStr_(s){ let h=0; for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))|0; return h>>>0; }\nfunction mulberry32_(seed){\n  return function(){\n    seed=(seed+0x6D2B79F5)|0;\n    let t=Math.imul(seed^seed>>>15,1|seed);\n    t=(t+Math.imul(t^t>>>7,61|t))^t;\n    return ((t^t>>>14)>>>0)/4294967296;\n  };\n}\nfunction decorativeWaveform_(seedStr,n){\n  const rand = mulberry32_(hashStr_(seedStr));\n  const out=[]; let v=.45;\n  for(let i=0;i<n;i++){ v += (rand()-.5)*.4; v = Math.max(.08, Math.min(1,v)); out.push(v); }\n  return out;\n}\n\nclass Component extends DCLogic {\n  state = {\n    rowsRaw: [], loading: true, error: null, diag: null,\n    query: '', grades: [], industries: [], audiences: [], offers: [],\n    sortKey: 'age', sortDir: 'asc', selected: [], openLink: null, dl: null,\n  };\n  waveCache = {};\n\n  componentDidMount(){ this.load(); }\n  componentWillUnmount(){ clearInterval(this._t1); clearTimeout(this._t2); }\n\n  load(){\n    fetch(CSV_URL, { cache:'no-store' })\n      .then(r => { if(!r.ok) throw new Error('HTTP '+r.status); return r.text(); })\n      .then(text => {\n        const rows = parseCsv(text);\n        const records = csvRowsToRecords(rows);\n        this.setState({ rowsRaw: dedupeToChampions(records), loading:false, error:null,\n          diag: { rawRowCount: rows.length, headers: rows[0]||[], parsedCount: records.length } });\n      })\n      .catch(err => this.setState({ rowsRaw:[], loading:false, error: err.message || String(err) }));\n  }\n\n  alertDays(){ return Number(this.props.ageAlertDays ?? 60); }\n\n  ageNeon(d){\n    if (d===null) return '#8a94a3';\n    if (d<=7) return '#00e0ff';\n    if (d<=30) return '#35b0ff';\n    if (d<this.alertDays()) return '#f0a52a';\n    return '#ff5470';\n  }\n\n  toggleIn(key, val){\n    const arr = this.state[key].slice();\n    const i = arr.indexOf(val);\n    if (i>=0) arr.splice(i,1); else arr.push(val);\n    this.setState({ [key]: arr });\n  }\n  sortBy(key){\n    if (this.state.sortKey === key) this.setState({ sortDir: this.state.sortDir==='asc'?'desc':'asc' });\n    else this.setState({ sortKey:key, sortDir:'asc' });\n  }\n  toggleSel(link){\n    const s = this.state.selected.slice();\n    const i = s.indexOf(link);\n    if (i>=0) s.splice(i,1); else s.push(link);\n    this.setState({ selected: s });\n  }\n\n  downloadReal(r){\n    const direct = driveDirectUrl_(r.link);\n    if (!direct) return;\n    const a = document.createElement('a');\n    a.href = direct; a.download = fileName(r);\n    document.body.appendChild(a); a.click(); a.remove();\n  }\n  startDownload(items, label){\n    clearInterval(this._t1); clearTimeout(this._t2);\n    if (!items.length) return;\n    this.setState({ dl: { file: label, pct: 0, done: false, count: items.length } });\n    const perTick = Math.max(1, 8 - Math.min(6, items.length));\n    this._t1 = setInterval(() => {\n      const dl = this.state.dl; if (!dl) return;\n      const next = Math.min(100, dl.pct + perTick + Math.random()*7);\n      if (next >= 100){\n        clearInterval(this._t1);\n        this.setState({ dl: Object.assign({}, dl, { pct:100, done:true }) });\n        items.forEach((r,i) => setTimeout(() => this.downloadReal(r), i*350));\n        this._t2 = setTimeout(() => this.setState({ dl:null }), 1300);\n      } else {\n        this.setState({ dl: Object.assign({}, dl, { pct: next }) });\n      }\n    }, 110);\n  }\n\n  wave(link){\n    if (!this.waveCache[link]) this.waveCache[link] = decorativeWaveform_(link, WAVE_BARS);\n    return this.waveCache[link];\n  }\n\n  chip(label, active){\n    const base = 'font-family:\\'IBM Plex Mono\\',monospace;font-size:10px;letter-spacing:.1em;padding:6px 9px;cursor:pointer;transition:all 140ms;';\n    return active\n      ? base+'border:1px solid #00e0ff;background:linear-gradient(180deg,#1a8cff,#0a4f9e);color:#fff;box-shadow:0 0 16px rgba(0,224,255,.7),inset 0 1px 0 rgba(255,255,255,.35);text-shadow:0 0 8px rgba(255,255,255,.6)'\n      : base+'border:1px solid #8fa2b8;background:linear-gradient(180deg,#fbfdff,#dce5f0);color:#33475f;box-shadow:inset 0 1px 0 rgba(255,255,255,.9)';\n  }\n\n  renderVals(){\n    const s = this.state;\n    const glow = this.props.glow ?? 'high';\n    const q = s.query.trim().toLowerCase();\n    let rows = s.rowsRaw.filter(r => {\n      if (s.grades.length && s.grades.indexOf(r.grade)<0) return false;\n      if (s.industries.length && s.industries.indexOf(r.ind)<0) return false;\n      if (s.audiences.length && s.audiences.indexOf(r.aud)<0) return false;\n      if (s.offers.length && s.offers.indexOf(r.off)<0) return false;\n      if (q && searchable(r).indexOf(q)<0) return false;\n      return true;\n    });\n    const dir = s.sortDir==='asc' ? 1 : -1;\n    rows = rows.slice().sort((a,b) => {\n      let av,bv;\n      if (s.sortKey==='age'){ av = ageDays(a.date) ?? 999999; bv = ageDays(b.date) ?? 999999; }\n      else if (s.sortKey==='seconds'){ av = Number(a.duration)||-1; bv = Number(b.duration)||-1; }\n      else if (s.sortKey==='grade'){ av = GRADE_RANK[a.grade] ?? 999; bv = GRADE_RANK[b.grade] ?? 999; }\n      else if (s.sortKey==='agent'){ av = a.agent.toLowerCase(); bv = b.agent.toLowerCase(); }\n      else { av = a.ind.toLowerCase(); bv = b.ind.toLowerCase(); }\n      return av < bv ? -dir : av > bv ? dir : 0;\n    });\n\n    const uniq = k => Array.from(new Set(s.rowsRaw.map(r => r[k]))).filter(Boolean).sort();\n    const mk = (key, list, fmt) => list.map(v => ({\n      label: fmt ? titleCase(v) : v,\n      style: this.chip(v, this.state[key].indexOf(v)>=0),\n      onClick: () => this.toggleIn(key, v),\n    }));\n\n    const gradeBadge = (g, big) => {\n      const neon = GRADE_NEON[g] || '#8a94a3';\n      const size = big ? 'width:58px;height:58px;font-size:24px;' : 'width:44px;height:28px;font-size:15px;';\n      const anim = (glow!=='off' && (g==='A+'||g==='A')) ? 'animation:glowPulse 2.6s ease-in-out infinite;' : '';\n      return 'display:flex;align-items:center;justify-content:center;'+size+\n        'font-family:\\'Saira Condensed\\',sans-serif;font-weight:900;font-style:italic;letter-spacing:.02em;'+\n        'border:1px solid '+neon+';background:linear-gradient(180deg,#f7fbff,#c3d3e4 48%,#8ea3ba 52%,#eaf3ff);color:#0b2036;'+\n        'box-shadow:0 0 '+(glow==='off'?'0':'14px')+' '+neon+'88,inset 0 1px 0 rgba(255,255,255,.8);'+anim;\n    };\n    const ageBadge = (d, big) => {\n      const neon = this.ageNeon(d);\n      return 'display:inline-flex;align-items:center;justify-content:center;'+(big?'height:30px;padding:0 13px;font-size:12.5px;':'min-width:48px;height:24px;padding:0 8px;font-size:11.5px;')+\n        'font-weight:600;letter-spacing:.06em;white-space:nowrap;border:1px solid '+neon+';background:'+(big?'linear-gradient(180deg,#16233a,#0b1220)':'linear-gradient(180deg,#f7fbff,#dbe6f3)')+\n        ';color:'+(big?neon:'#16283d')+';box-shadow:0 0 10px '+neon+'55';\n    };\n\n    const openRec = s.openLink ? s.rowsRaw.find(r => r.link===s.openLink) : null;\n    const openRow = openRec ? (() => {\n      const d = ageDays(openRec.date);\n      const sel = s.selected.indexOf(openRec.link)>=0;\n      return {\n        agent: openRec.agent || '—',\n        grade: openRec.grade || '—',\n        modalGradeStyle: gradeBadge(openRec.grade, true),\n        ageWords: d===null ? '—' : d===0 ? 'today' : d + (d===1?' day ago':' days ago'),\n        modalAgeStyle: ageBadge(d, true),\n        dur: fmtDur_(openRec.duration) || '—',\n        date: openRec.date || '—',\n        ind: titleCase(openRec.ind) || '—',\n        aud: titleCase(openRec.aud) || '—',\n        off: titleCase(openRec.off) || '—',\n        note: openRec.note || '—',\n        rationale: openRec.rationale || '',\n        link: openRec.link,\n        previewUrl: drivePreviewUrl_(openRec.link),\n        toggleLabel: sel ? '✓ In loadout' : '+ Add to loadout',\n        modalToggleStyle: 'font-family:\\'Saira Condensed\\',sans-serif;font-weight:800;font-size:13px;letter-spacing:.14em;text-transform:uppercase;padding:10px 16px;cursor:pointer;'+\n          (sel ? 'border:1px solid #00e0ff;background:linear-gradient(180deg,#0b3a5c,#06202f);color:#8ff0ff;box-shadow:0 0 16px rgba(0,224,255,.5)'\n               : 'border:1px solid #33506f;background:linear-gradient(180deg,#1b2b42,#0d1626);color:#9fc4e8'),\n        wave: this.wave(openRec.link).map((v,i) => ({\n          style: 'flex:1;min-width:2px;height:'+Math.round(v*32)+'px;background:linear-gradient(180deg,#00e0ff,#1a8cff);box-shadow:0 0 8px rgba(0,224,255,.7);transform-origin:bottom;animation:wavePulse 1.6s ease-in-out infinite;animation-delay:'+(i*0.03)+'s'\n        })),\n      };\n    })() : null;\n\n    const allSelected = rows.length>0 && rows.every(r => s.selected.indexOf(r.link)>=0);\n    const arrow = k => s.sortKey===k ? (s.sortDir==='asc'?'▲':'▼') : '';\n\n    const dl = s.dl ? {\n      title: s.dl.done ? 'Complete' : 'Copying',\n      file: s.dl.file,\n      status: s.dl.done ? 'Saved to Downloads' : 'Copying from Google Drive…',\n      pctLabel: Math.round(s.dl.pct)+'% of '+s.dl.count+' item'+(s.dl.count===1?'':'s'),\n      btnLabel: s.dl.done ? 'OK' : 'Cancel',\n      fillStyle: 'height:100%;width:'+Math.round(s.d nt || '—',\n          ind: titleCase(r.ind),\n          aud: titleCase(r.aud),\n          note: r.note || '',\n          rowStyle: 'display:grid;grid-template-columns:40px 50px 68px 68px 76px 1.1fr .9fr .9fr 2fr;align-items:center;height:46px;border-bottom:1px solid #dbe4ef;cursor:pointer;transition:background 140ms,box-shadow 200ms,transform 140ms;'+\n            (sel ? 'background:linear-gradient(90deg,#e2f1ff,#f6faff);box-shadow:inset 4px 0 0 #00e0ff,0 0 22px rgba(0,224,255,.25)' : 'background:#fff'),\n          checkStyle: 'width:15px;height:15px;cursor:pointer;font-size:10px;line-height:13px;text-align:center;transition:all 140ms;'+\n            (sel ? 'border:1px solid #00e0ff;background:linear-gradient(180deg,#1a8cff,#0a4f9e);color:#fff;box-shadow:0 0 12px rgba(0,224,255,.8)'\n                 : 'border:1px solid #8fa2b8;background:linear-gradient(180deg,#fff,#dee7f2);color:transparent'),\n          checkMark: sel ? '✓' : '',\n          onOpen: () => this.setState({ openLink: r.link }),\n          onToggle: e => { e.stopPropagation(); this.toggleSel(r.link); },\n          onDownload: e => { e.stopPropagation(); this.startDownload([r], fileName(r)); },\n        };\n      }),\n      showEmpty: !!emptyMsg,\n      emptyMsg,\n      countLabel: rows.length+' of '+s.rowsRaw.length+' calls',\n      sortLabel: 'sorted by '+(s.sortKey==='seconds'?'length':s.sortKey)+' '+(s.sortDir==='asc'?'▲':'▼'),\n      onToggleAll: () => {\n        if (allSelected) this.setState({ selected: s.selected.filter(l => !rows.some(r => r.link===l)) });\n        else this.setState({ selected: Array.from(new Set(s.selected.concat(rows.map(r => r.link)))) });\n      },\n      toggleAllStyle: 'width:15px;height:15px;cursor:pointer;transition:all 140ms;'+\n        (allSelected ? 'border:1px solid #00e0ff;background:linear-gradient(180deg,#1a8cff,#0a4f9e);box-shadow:0 0 12px rgba(0,224,255,.8)'\n                     : 'border:1px solid #4d6b8e;background:linear-gradient(180deg,#1b2b42,#0d1626)')
