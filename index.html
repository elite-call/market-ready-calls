<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Sample Call Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<!--
  Reads the published-to-web CSV export of the Google Sheet that sits behind
  the shared submission Form. No sign-in needed — a published sheet is
  publicly readable by URL. No backend, no Drive API.

  UI is a port of a neo-brutalist table-view mockup (grade/age/length columns,
  filter chips, checkbox multi-select "sample set" tray, click-to-expand
  detail modal). The Download button's progress bar is decorative — Drive
  doesn't expose a real download-progress API — but "Share set" triggers
  actual browser downloads for every selected file in one go.
-->
<style>
  :root{
    --ink:#111; --paper:#fff; --panel-bg:#fafafa; --muted:#999; --muted2:#888;
    --row-border:#e2e2e2;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:#fff;color:var(--ink);-webkit-font-smoothing:antialiased}
  a{color:var(--ink);text-decoration:none}
  a:hover{color:oklch(0.55 0.16 250)}
  input{font:inherit}
  input:focus{outline:none}
  button{font:inherit}
  ::-webkit-scrollbar{width:14px;height:14px}
  ::-webkit-scrollbar-track{background:#f0f0f0;border-left:2px solid #000}
  ::-webkit-scrollbar-thumb{background:linear-gradient(90deg,#fafafa,#dcdcdc);border:2px solid #000}
  @keyframes zoomWin{from{transform:scale(.55) translateY(14px);opacity:.2}to{transform:scale(1) translateY(0);opacity:1}}
  @keyframes barShift{from{background-position:0 0}to{background-position:12px 0}}

  .wrap{min-height:100vh;background:#fff;padding:34px 40px 60px;font-family:'IBM Plex Mono',ui-monospace,monospace}
  .topbar{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:12px}
  .kicker{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted2)}
  .title{font-family:Archivo,sans-serif;font-weight:700;font-size:26px;letter-spacing:-.01em}
  .titlecol{display:flex;flex-direction:column;gap:6px}
  .srcflag{display:flex;align-items:center;gap:10px}
  .hatch-h{width:120px;height:12px;background:repeating-linear-gradient(90deg,#111 0 2px,transparent 2px 6px)}
  .srclabel{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted2)}

  .panel{background:#111;clip-path:polygon(22px 0,100% 0,100% calc(100% - 22px),calc(100% - 22px) 100%,0 100%,0 22px);box-shadow:7px 7px 0 rgba(17,17,17,.10)}
  .panel-inner{margin:2px;background:#fff;clip-path:polygon(21px 0,100% 0,100% calc(100% - 21px),calc(100% - 21px) 100%,0 100%,0 21px)}

  .titlebar{display:flex;align-items:center;gap:8px;height:32px;padding:0 9px;background:linear-gradient(#f7f7f7,#e2e2e2);border-bottom:2px solid #111}
  .dot-box{width:14px;height:14px;border:2px solid #111;background:#fff;display:flex;align-items:center;justify-content:center;flex:none}
  .dot-box i{width:4px;height:4px;background:#111}
  .hatch-v{flex:1;height:9px;background:repeating-linear-gradient(to bottom,#111 0 1px,transparent 1px 3px)}
  .titlebar-label{font-family:Archivo,sans-serif;font-weight:700;font-size:12px;letter-spacing:.16em;text-transform:uppercase;white-space:nowrap}
  .win-btn{width:14px;height:14px;border:2px solid #111;background:#fff;padding:2px;flex:none}
  .win-btn i{display:block;width:100%;height:100%;border:1px solid #111}
  .win-btn.lines{background-image:repeating-linear-gradient(to bottom,#111 0 1px,transparent 1px 3px)}
  .close-btn{width:16px;height:16px;border:2px solid #111;background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:Archivo,sans-serif;font-weight:700;font-size:11px;line-height:1;color:#111;flex:none}
  .close-btn:hover{background:#111;color:#fff}

  .filters-bar{display:flex;align-items:center;gap:14px;padding:11px 12px;border-bottom:2px solid #111;background:var(--panel-bg);flex-wrap:wrap}
  .search-box{display:flex;align-items:center;border:2px solid #111;background:#fff;height:28px;clip-path:polygon(8px 0,100% 0,100% 100%,0 100%,0 8px)}
  .search-box .icon{padding:0 8px;font-size:11px;color:var(--muted)}
  .search-box input{border:none;background:transparent;width:210px;font-size:12px;padding:0 8px 0 0;color:#111}
  .chip-group{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .chip-group .glabel{font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
  .chip{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.1em;padding:5px 8px;border:2px solid #111;cursor:pointer;background:#fff;color:#333}
  .chip.active{background:#111;color:#fff}
  .filler{flex:1;min-width:20px}
  .hatch-h60{width:60px;height:14px;background:repeating-linear-gradient(90deg,#111 0 1px,transparent 1px 4px)}

  .grid-row{display:grid;grid-template-columns:38px 44px 60px 60px 66px 1.2fr 1fr 2.4fr;align-items:center}
  .table-header{background:#ededed;border-bottom:2px solid #111;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:#444}
  .table-header > div{padding:9px 6px}
  .table-header .sortable{cursor:pointer}
  .table-header .sortable:hover{color:#111}
  .th-check{padding:9px 0 9px 12px !important}
  .th-toggle{width:13px;height:13px;border:2px solid #111;background:#fff;cursor:pointer}

  .table-body{max-height:560px;overflow-y:auto;background:#fff}
  .row{border-bottom:1px solid var(--row-border);cursor:pointer;background:#fff}
  .row:hover{background:#fbfbfb}
  .row.selected{background:#f5f5f5;box-shadow:inset 4px 0 0 #111}
  .row > div{padding:0 6px}
  .cell-check{padding:0 0 0 12px !important}
  .checkbox-box{width:13px;height:13px;border:2px solid #111;background:#fff;color:#fff;font-size:9px;line-height:11px;text-align:center;cursor:pointer}
  .checkbox-box.on{background:#111}
  .cell-dl{padding:0 4px !important}
  .dl-icon-btn{display:flex;align-items:center;justify-content:center;width:26px;height:26px;border:2px solid #111;background:#fff;cursor:pointer;color:#111;padding:0}
  .dl-icon-btn:hover{background:#111;color:#fff}
  .dl-icon-btn span{display:block;width:12px;border-bottom:2px solid currentColor;text-align:center;font-size:11px;line-height:13px}
  .badge{display:flex;align-items:center;justify-content:center;width:38px;height:26px;border:2px solid #111;font-family:Archivo,sans-serif;font-weight:700;font-size:12px;letter-spacing:.02em}
  .agebadge{display:inline-flex;align-items:center;justify-content:center;min-width:44px;height:22px;padding:0 7px;border:2px solid #111;font-size:11px;font-weight:600}
  .cell-dur{font-size:11.5px;color:#333;font-variant-numeric:tabular-nums}
  .cell-agent{font-size:12.5px;font-weight:500}
  .cell-industry{font-size:11px;letter-spacing:.04em;color:#333}
  .cell-note{padding:0 12px 0 6px !important;font-size:11px;color:#767676;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .empty-state{padding:54px 12px;text-align:center;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#aaa}
  .empty-state.err{color:#c0392b;white-space:pre-wrap;line-height:1.6}

  .footer-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;height:28px;padding:0 12px;border-top:2px solid #111;background:linear-gradient(#f7f7f7,#e9e9e9);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:#555}
  .footer-hatch{flex:1;height:7px;background:repeating-linear-gradient(to bottom,#111 0 1px,transparent 1px 3px);opacity:.35}

  .tray-panel{margin-top:22px;background:#111;clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,18px 100%,0 calc(100% - 18px))}
  .tray-inner{margin:2px;background:#fff;clip-path:polygon(0 0,calc(100% - 17px) 0,100% 17px,100% 100%,17px 100%,0 calc(100% - 17px));padding:14px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .tray-label-col{display:flex;flex-direction:column;gap:3px;min-width:150px}
  .tray-label{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
  .tray-count{font-family:Archivo,sans-serif;font-weight:700;font-size:15px}
  .tray-chips{flex:1;display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:200px}
  .tray-chip{display:flex;align-items:center;gap:8px;border:2px solid #111;padding:4px 6px 4px 8px;font-size:11px}
  .tray-chip .dot{display:inline-block;width:10px;height:10px;border:1px solid #111}
  .tray-chip .ind{color:var(--muted)}
  .tray-chip button{border:none;background:transparent;cursor:pointer;font-family:inherit;font-size:11px;color:#111;padding:0 2px}
  .tray-empty{font-size:11px;color:#aaa;letter-spacing:.04em}
  .tray-actions{display:flex;align-items:center;gap:10px}
  .btn-clear{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;background:#fff;border:2px solid #111;padding:9px 12px;cursor:pointer}
  .btn-clear:hover{background:#f0f0f0}
  .btn-share{font-family:Archivo,sans-serif;font-weight:700;font-size:11px;letter-spacing:.14em;text-transform:uppercase;background:#111;color:#fff;border:2px solid #111;padding:10px 18px;cursor:pointer;box-shadow:4px 4px 0 rgba(17,17,17,.18);clip-path:polygon(7px 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%,0 7px)}
  .btn-share:hover{box-shadow:2px 2px 0 rgba(17,17,17,.18)}
  .btn-share:disabled{opacity:.4;cursor:default;box-shadow:none}

  .modal-overlay{position:fixed;inset:0;background:rgba(17,17,17,.18);display:flex;align-items:center;justify-content:center;padding:32px;z-index:50;font-family:'IBM Plex Mono',ui-monospace,monospace}
  .modal-box{width:640px;max-width:100%;background:#111;clip-path:polygon(22px 0,100% 0,100% calc(100% - 22px),calc(100% - 22px) 100%,0 100%,0 22px);box-shadow:10px 10px 0 rgba(17,17,17,.16);animation:zoomWin 160ms ease-out}
  .modal-meta{display:flex;align-items:center;gap:14px;padding:16px;border-bottom:2px solid #111;background:var(--panel-bg)}
  .modal-badge{display:flex;align-items:center;justify-content:center;width:52px;height:52px;border:2px solid #111;font-family:Archivo,sans-serif;font-weight:700;font-size:20px}
  .modal-agebadge{display:inline-flex;align-items:center;justify-content:center;height:26px;padding:0 10px;border:2px solid #111;font-size:11.5px;font-weight:600;letter-spacing:.04em}
  .modal-stat{display:flex;flex-direction:column;gap:2px}
  .modal-stat span:first-child{font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
  .modal-stat span:last-child{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
  .modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:#e2e2e2;border-bottom:2px solid #111}
  .modal-grid .cell{background:#fff;padding:14px 16px;display:flex;flex-direction:column;gap:5px}
  .modal-grid .cell.wide{grid-column:span 2}
  .modal-grid .cell span:first-child{font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
  .modal-grid .cell span:last-child{font-size:13px;letter-spacing:.04em}
  .modal-grid .cell.wide.note span:last-child{font-size:13px;line-height:1.55;color:#333;letter-spacing:normal}
  .modal-actions{display:flex;align-items:center;gap:10px;padding:14px 16px;background:var(--panel-bg)}
  .modal-actions .play{display:flex;align-items:center;gap:8px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;border:2px solid #111;background:#111;color:#fff;padding:9px 14px}
  .modal-actions .play:hover{opacity:.85}
  .modal-actions .ghost{font-family:inherit;font-size:10px;letter-spacing:.14em;text-transform:uppercase;border:2px solid #111;background:#fff;color:#111;padding:9px 14px;cursor:pointer}
  .modal-actions .ghost:hover{background:#f0f0f0}

  .dl-overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:60;pointer-events:none;font-family:'IBM Plex Mono',ui-monospace,monospace}
  .dl-box{width:390px;background:#111;box-shadow:8px 8px 0 rgba(17,17,17,.2);animation:zoomWin 140ms ease-out;pointer-events:auto}
  .dl-inner{margin:2px;background:#fff}
  .dl-bar{padding:16px;display:flex;flex-direction:column;gap:12px}
  .dl-file-row{display:flex;align-items:center;gap:10px}
  .dl-icon{width:26px;height:32px;border:2px solid #111;background:#fff;background-image:repeating-linear-gradient(to bottom,#111 0 1px,transparent 1px 5px)}
  .dl-file-text{display:flex;flex-direction:column;gap:3px;overflow:hidden}
  .dl-file-text span:first-child{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dl-file-text span:last-child{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .dl-track{height:20px;border:2px solid #111;background:#fff;padding:2px}
  .dl-fill{height:100%;background:repeating-linear-gradient(115deg,#111 0 4px,transparent 4px 8px);animation:barShift 500ms linear infinite;transition:width 120ms linear}
  .dl-footer{display:flex;align-items:center;justify-content:space-between}
  .dl-pct{font-size:10px;letter-spacing:.12em;color:#666;font-variant-numeric:tabular-nums}

  /* ======================= RETRO PIXEL CURSOR ======================= */
  *{cursor:none}
  .pixel-cursor{position:fixed;top:0;left:0;pointer-events:none;z-index:99999;will-change:transform}
  .pixel-cursor svg{display:block;image-rendering:pixelated;image-rendering:crisp-edges}
</style>
</head>
<body>
<div class="pixel-cursor" id="pixelCursor"></div>
<div class="wrap">

  <div class="topbar">
    <div class="titlecol">
      <div class="kicker">Sales Enablement</div>
      <div class="title">Sample Call Library</div>
    </div>
    <div class="srcflag">
      <div class="hatch-h"></div>
      <div class="srclabel">Form_Responses</div>
    </div>
  </div>

  <div id="app"></div>

</div>

<script>
"use strict";
const AGE_ALERT_DAYS = 60;
const $ = id => document.getElementById(id);
const app = $('app');

/* ======================= SHARED DATA SOURCE (published CSV) =============== */
const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRT6sX6uL-Rv_t-FCAzWGn96-OkhCFyF7ELzXlvDqYuIhvuR0_Cyr2akbbGxvm5alDTPopJf8IV9nmG/pub?gid=1317295187&single=true&output=csv';

function parseCsv(text){
  var rows=[],row=[],f='',q=false;
  for(var i=0;i<text.length;i++){var c=text[i];
    if(q){if(c==='"'&&text[i+1]==='"'){f+='"';i++;}else if(c==='"')q=false;else f+=c;}
    else if(c==='"')q=true;else if(c===','){row.push(f);f='';}
    else if(c==='\n'){row.push(f);rows.push(row);row=[];f='';}
    else if(c!=='\r')f+=c;}
  if(f.length||row.length){row.push(f);rows.push(row);}
  return rows.filter(r=>r.length>1&&r.some(c=>c!==''));
}

function csvRowsToRecords(rows){
  if (rows.length < 2) return [];
  const header = rows[0].map(h => h.toLowerCase());
  const idx = word => header.findIndex(h => h.indexOf(word) >= 0);
  const col = { logged_at: 0, link: idx('link'), agent: idx('agent'), date: idx('date'),
    ind: idx('industry'), aud: idx('audience'), off: idx('offer'), grade: idx('grade'), note: idx('note') };
  return rows.slice(1).map(r => ({
    logged_at: r[col.logged_at]||'', link: r[col.link]||'', agent: r[col.agent]||'', date: r[col.date]||'',
    ind: r[col.ind]||'', aud: r[col.aud]||'', off: r[col.off]||'', grade: r[col.grade]||'', note: r[col.note]||'',
  })).filter(r => r.link);
}

function loggedAtMs_(s){
  const t = Date.parse(s || '');
  return isNaN(t) ? 0 : t;
}
function dedupeToChampions(records){
  const byType = {};
  records.forEach(r => {
    const key = r.ind+'|||'+r.aud+'|||'+r.off;
    const existing = byType[key];
    if (!existing || (r.date||'') > (existing.date||'') ||
        ((r.date||'')===(existing.date||'') && loggedAtMs_(r.logged_at) > loggedAtMs_(existing.logged_at))) {
      byType[key] = r;
    }
  });
  return Object.values(byType);
}

let SOURCE_ROWS = [];
let LOAD_ERROR = null;
let LAST_DIAGNOSTIC = null;

/* ======================= LIVE DURATION LOOKUP ============================== */
function driveDirectUrl_(shareLink){
  const m = String(shareLink||'').match(/\/d\/([a-zA-Z0-9_-]+)/) || String(shareLink||'').match(/[?&]id=([a-zA-Z0-9_-]+)/);
  if (!m) return null;
  return 'https://drive.google.com/uc?export=download&id=' + m[1];
}
const durationCache = {};   // link -> "3:42" | "—"
const durationSeconds = {}; // link -> number | undefined
function getDuration_(link, onLoaded){
  const direct = driveDirectUrl_(link);
  if (!direct) { durationCache[link] = '\u2014'; return; }
  if (durationCache[link] !== undefined) return;
  const audio = document.createElement('audio');
  audio.preload = 'metadata';
  audio.src = direct;
  audio.addEventListener('loadedmetadata', () => {
    const s = Math.round(audio.duration);
    const fmt = isFinite(s) ? Math.floor(s/60) + ':' + String(s%60).padStart(2,'0') : '\u2014';
    durationCache[link] = fmt;
    if (isFinite(s)) durationSeconds[link] = s;
    if (onLoaded) onLoaded();
  });
  audio.addEventListener('error', () => { durationCache[link] = '\u2014'; if (onLoaded) onLoaded(); });
}

function loadFromSheet(){
  return fetch(CSV_URL, { cache: 'no-store' })
    .then(r => { if (!r.ok) throw new Error('HTTP '+r.status); return r.text(); })
    .then(text => {
      const rows = parseCsv(text);
      const records = csvRowsToRecords(rows);
      LAST_DIAGNOSTIC = {
        rawRowCount: rows.length,
        headers: rows[0] || [],
        parsedCount: records.length,
        sampleRawRow: rows[1] || null,
      };
      SOURCE_ROWS = dedupeToChampions(records);
      LOAD_ERROR = null;
    })
    .catch(err => {
      SOURCE_ROWS = [];
      LAST_DIAGNOSTIC = null;
      LOAD_ERROR = err.message || String(err);
    });
}

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function titleCase(s){return String(s||'').toLowerCase().replace(/\b\w/g,c=>c.toUpperCase());}
function ageDays(dateStr){
  if(!dateStr) return null;
  const d = new Date(dateStr + 'T00:00:00'); if (isNaN(d)) return null;
  return Math.floor((Date.now()-d.getTime())/86400000);
}
function ageColor(d){
  if (d===null) return '#eee';
  if (d<=7) return 'oklch(0.80 0.17 148)';
  if (d<=30) return 'oklch(0.85 0.14 196)';
  if (d<AGE_ALERT_DAYS) return 'oklch(0.87 0.14 82)';
  return 'oklch(0.85 0.13 25)';
}
function searchable(r){ return [r.ind,r.aud,r.off,r.agent,r.note].filter(Boolean).join(' ').toLowerCase(); }
function fileName(r){
  const last = (r.agent||'call').split(',')[0].trim().toLowerCase().replace(/[^a-z0-9]+/g,'-') || 'call';
  const ind = (r.ind||'').toLowerCase().replace(/[^a-z0-9]+/g,'-');
  return last + '_' + ind + '_' + (r.date||'') + '.mp3';
}

/* ======================= GRADES ============================== */
const GRADES = ['A+','A','A-','B+','B','B-'];
const GRADE_RANK = { 'A+':0,'A':1,'A-':2,'B+':3,'B':4,'B-':5 };
const GRADE_COLOR = {
  'A+': 'oklch(0.80 0.17 148)',
  'A':  'oklch(0.83 0.15 165)',
  'A-': 'oklch(0.88 0.13 150)',
  'B+': 'oklch(0.84 0.13 236)',
  'B':  'oklch(0.90 0.08 238)',
  'B-': 'oklch(0.87 0.14 82)',
};
function gradeColor(g){ return GRADE_COLOR[g] || '#eee'; }

/* ======================= APP STATE ============================== */
const state = {
  query: '',
  grades: [],
  industries: [],
  sortKey: 'age',
  sortDir: 'asc',
  selected: new Set(),
  openLink: null,
  dl: null, // { link, file, pct, done }
};

function toggleIn_(arr, val){
  const i = arr.indexOf(val);
  if (i >= 0) arr.splice(i,1); else arr.push(val);
}

function sortBy(key){
  if (state.sortKey === key) state.sortDir = state.sortDir === 'asc' ? 'desc' : 'asc';
  else { state.sortKey = key; state.sortDir = 'asc'; }
  render();
}

function startDownload(r){
  clearInterval(window.__dlTimer); clearTimeout(window.__dlTimer2);
  state.dl = { link: r.link, file: fileName(r), pct: 0, done: false };
  render(); // mount — this is the only tick allowed to replay the pop-in animation
  window.__dlTimer = setInterval(() => {
    if (!state.dl) return;
    const next = Math.min(100, state.dl.pct + 3 + Math.random()*11);
    if (next >= 100) {
      clearInterval(window.__dlTimer);
      state.dl.pct = 100; state.dl.done = true;
      updateDownloadModal_(); // in-place update, no re-mount
      window.__dlTimer2 = setTimeout(() => { state.dl = null; render(); }, 1100); // unmount
    } else {
      state.dl.pct = next;
      updateDownloadModal_(); // in-place update, no re-mount
    }
  }, 110);
}
function updateDownloadModal_(){
  if (!state.dl) return;
  const pct = Math.round(state.dl.pct);
  const fill = document.getElementById('dlFill');
  if (fill) fill.style.cssText = 'height:100%;width:' + pct + '%;background:repeating-linear-gradient(115deg,#111 0 4px,transparent 4px 8px),' + (state.dl.done ? 'oklch(0.80 0.17 148)' : 'oklch(0.85 0.14 196)') + ';animation:barShift 500ms linear infinite;transition:width 120ms linear;';
  const pctText = document.getElementById('dlPctText');
  if (pctText) pctText.textContent = pct + '% of 1 item';
  const title = document.getElementById('dlTitleText');
  if (title) title.textContent = state.dl.done ? 'Complete' : 'Copying';
  const status = document.getElementById('dlStatusText');
  if (status) status.textContent = state.dl.done ? 'Saved to Downloads' : 'Copying from Google Drive\u2026';
  const btn = document.getElementById('dlCancel');
  if (btn) btn.textContent = state.dl.done ? 'OK' : 'Cancel';
}
function cancelDownload(){
  clearInterval(window.__dlTimer); clearTimeout(window.__dlTimer2);
  state.dl = null; render();
}

function triggerShareDownloads(rows){
  const items = rows.filter(r => state.selected.has(r.link));
  items.forEach((r, i) => {
    setTimeout(() => {
      const direct = driveDirectUrl_(r.link);
      if (!direct) return;
      const a = document.createElement('a');
      a.href = direct;
      a.download = fileName(r);
      document.body.appendChild(a);
      a.click();
      a.remove();
    }, i * 350); // stagger slightly — browsers can flag rapid multi-downloads from one click
  });
}

/* ======================= RENDER ============================== */
function render(){
  // preserve search-box focus/caret across full re-renders
  const activeIsSearch = document.activeElement && document.activeElement.id === 'q';
  const caret = activeIsSearch ? document.activeElement.selectionStart : null;

  if (LOAD_ERROR || (LAST_DIAGNOSTIC && LAST_DIAGNOSTIC.rawRowCount <= 1) ||
      (LAST_DIAGNOSTIC && LAST_DIAGNOSTIC.rawRowCount > 1 && LAST_DIAGNOSTIC.parsedCount === 0)) {
    app.innerHTML = renderEmptyShell_();
    return;
  }

  const q = state.query.trim().toLowerCase();
  let rows = SOURCE_ROWS.filter(r => {
    if (state.grades.length && !state.grades.includes(r.grade)) return false;
    if (state.industries.length && !state.industries.includes(r.ind)) return false;
    if (q && searchable(r).indexOf(q) < 0) return false;
    return true;
  });

  const dir = state.sortDir === 'asc' ? 1 : -1;
  rows = rows.slice().sort((a,b) => {
    let av, bv;
    if (state.sortKey === 'age') { av = ageDays(a.date) ?? 999999; bv = ageDays(b.date) ?? 999999; }
    else if (state.sortKey === 'seconds') { av = durationSeconds[a.link] ?? -1; bv = durationSeconds[b.link] ?? -1; }
    else if (state.sortKey === 'grade') { av = GRADE_RANK[a.grade] ?? 999; bv = GRADE_RANK[b.grade] ?? 999; }
    else if (state.sortKey === 'agent') { av = a.agent.toLowerCase(); bv = b.agent.toLowerCase(); }
    else { av = a.ind.toLowerCase(); bv = b.ind.toLowerCase(); }
    return av < bv ? -dir : av > bv ? dir : 0;
  });

  const industryList = Array.from(new Set(SOURCE_ROWS.map(r => r.ind))).filter(Boolean).sort();

  const html = `
  <div class="panel">
    <div class="panel-inner">
      <div class="titlebar">
        <div class="dot-box"><i></i></div>
        <div class="hatch-v"></div>
        <div class="titlebar-label">Best Calls</div>
        <div class="hatch-v"></div>
        <div class="win-btn"><i></i></div>
        <div class="win-btn lines"></div>
      </div>

      <div class="filters-bar">
        <div class="search-box">
          <div class="icon">&#8981;</div>
          <input type="text" id="q" placeholder="agent, industry, offer, note…" value="${esc(state.query)}">
        </div>

        <div class="chip-group">
          <span class="glabel">Grade</span>
          ${GRADES.map(g => `<button class="chip grade-chip${state.grades.includes(g)?' active':''}" data-grade="${esc(g)}">${esc(g)}</button>`).join('')}
        </div>

        <div class="chip-group">
          <span class="glabel">Industry</span>
          ${industryList.map(i => `<button class="chip ind-chip${state.industries.includes(i)?' active':''}" data-ind="${esc(i)}">${esc(titleCase(i))}</button>`).join('')}
        </div>

        <div class="filler"></div>
        <div class="hatch-h60"></div>
      </div>

      <div class="grid-row table-header">
        <div class="th-check"><div class="th-toggle" id="toggleAll"></div></div>
        <div>Get</div>
        <div class="sortable" data-sort="grade">Gr${arrow_('grade')}</div>
        <div class="sortable" data-sort="age">Age${arrow_('age')}</div>
        <div class="sortable" data-sort="seconds">Len${arrow_('seconds')}</div>
        <div class="sortable" data-sort="agent">Agent${arrow_('agent')}</div>
        <div class="sortable" data-sort="industry">Industry${arrow_('industry')}</div>
        <div>Note</div>
      </div>

      <div class="table-body" id="tbody">
        ${rows.length ? rows.map(r => rowHtml_(r)).join('') : '<div class="empty-state">No calls match these filters</div>'}
      </div>

      <div class="footer-bar">
        <div>${rows.length} of ${SOURCE_ROWS.length} calls</div>
        <div class="footer-hatch"></div>
        <div>sorted by ${state.sortKey === 'seconds' ? 'length' : state.sortKey} ${state.sortDir === 'asc' ? '&#9650;' : '&#9660;'}</div>
      </div>
    </div>
  </div>

  <div class="tray-panel">
    <div class="tray-inner">
      <div class="tray-label-col">
        <div class="tray-label">Sample set</div>
        <div class="tray-count">${state.selected.size === 0 ? 'Empty' : state.selected.size + (state.selected.size===1?' call':' calls')}</div>
      </div>
      <div class="tray-chips">
        ${Array.from(state.selected).map(link => {
          const r = SOURCE_ROWS.find(x => x.link === link);
          if (!r) return '';
          return `<div class="tray-chip"><span class="dot" style="background:${gradeColor(r.grade)}"></span><span>${esc(r.agent)}</span><span class="ind">${esc(titleCase(r.ind))}</span><button data-remove="${esc(link)}">&#10005;</button></div>`;
        }).join('') || '<div class="tray-empty">Check rows above to build a set for a prospect.</div>'}
      </div>
      <div class="tray-actions">
        <button class="btn-clear" id="clearSel">Clear</button>
        <button class="btn-share" id="shareSet" ${state.selected.size===0?'disabled':''}>Share set &#8594;</button>
      </div>
    </div>
  </div>

  ${state.openLink ? detailModalHtml_(SOURCE_ROWS.find(r => r.link === state.openLink)) : ''}
  ${state.dl ? downloadModalHtml_() : ''}
  `;

  app.innerHTML = html;
  bindEvents_(rows);

  if (activeIsSearch) {
    const el = $('q');
    if (el) { el.focus(); el.setSelectionRange(caret, caret); }
  }

  // kick off duration lookups for any visible row missing a cached value
  rows.forEach(r => {
    if (durationCache[r.link] === undefined) {
      getDuration_(r.link, () => {
        const cell = document.querySelector('[data-dur="'+CSS.escape(r.link)+'"]');
        if (cell) cell.textContent = durationCache[r.link];
        if (state.sortKey === 'seconds') render();
      });
    }
  });
}

function arrow_(key){
  return state.sortKey === key ? (state.sortDir === 'asc' ? ' &#9650;' : ' &#9660;') : '';
}

function rowHtml_(r){
  const dd = ageDays(r.date);
  const sel = state.selected.has(r.link);
  const dur = durationCache[r.link];
  return `
  <div class="grid-row row${sel?' selected':''}" data-open="${esc(r.link)}">
    <div class="cell-check"><div class="checkbox-box${sel?' on':''}" data-toggle="${esc(r.link)}">${sel?'&#10003;':''}</div></div>
    <div class="cell-dl"><button class="dl-icon-btn" data-download="${esc(r.link)}" title="Download"><span>&#8595;</span></button></div>
    <div><div class="badge" style="background:${gradeColor(r.grade)}">${esc(r.grade)||'\u2014'}</div></div>
    <div><div class="agebadge" style="background:${ageColor(dd)}">${dd===null?'\u2014':dd+'d'}</div></div>
    <div class="cell-dur" data-dur="${esc(r.link)}">${dur === undefined ? '\u2026' : dur}</div>
    <div class="cell-agent">${esc(r.agent)||'\u2014'}</div>
    <div class="cell-industry">${esc(titleCase(r.ind))}</div>
    <div class="cell-note">${esc(r.note)}</div>
  </div>`;
}

function detailModalHtml_(r){
  if (!r) return '';
  const dd = ageDays(r.date);
  const ageLabel = dd === null ? '\u2014' : dd === 0 ? 'today' : dd + (dd===1?' day ago':' days ago');
  const dur = durationCache[r.link] === undefined ? '\u2026' : durationCache[r.link];
  const sel = state.selected.has(r.link);
  return `
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-box" id="modalBox">
      <div class="panel-inner" style="clip-path:polygon(21px 0,100% 0,100% calc(100% - 21px),calc(100% - 21px) 100%,0 100%,0 21px);">
        <div class="titlebar">
          <div class="close-btn" id="closeModal">&#10005;</div>
          <div class="hatch-v"></div>
          <div class="titlebar-label">${esc(r.agent)}</div>
          <div class="hatch-v"></div>
          <div class="win-btn"><i></i></div>
        </div>
        <div class="modal-meta">
          <div class="modal-badge" style="background:${gradeColor(r.grade)}">${esc(r.grade)||'\u2014'}</div>
          <div class="modal-agebadge" style="background:${ageColor(dd)}">${ageLabel}</div>
          <div class="modal-stat"><span>Duration</span><span>${dur}</span></div>
          <div class="modal-stat"><span>Recorded</span><span>${esc(r.date)||'\u2014'}</span></div>
          <div class="filler" style="height:14px;background:repeating-linear-gradient(90deg,#111 0 1px,transparent 1px 4px);opacity:.35;"></div>
        </div>
        <div class="modal-grid">
          <div class="cell"><span>Industry</span><span>${esc(titleCase(r.ind))}</span></div>
          <div class="cell"><span>Audience</span><span>${esc(r.aud)}</span></div>
          <div class="cell wide"><span>Offer</span><span>${esc(titleCase(r.off))}</span></div>
          <div class="cell wide note"><span>Note</span><span>${esc(r.note)||'\u2014'}</span></div>
        </div>
        <div class="modal-actions">
          <a class="play" href="${esc(r.link)}" target="_blank" rel="noopener">&#9654; Play recording</a>
          <button class="ghost" id="modalDownload">&#8595; Download</button>
          <div class="filler"></div>
          <button class="ghost" id="modalToggle">${sel ? '&#10003; In sample set' : '+ Add to set'}</button>
        </div>
      </div>
    </div>
  </div>`;
}

function downloadModalHtml_(){
  const dl = state.dl;
  const pct = Math.round(dl.pct);
  return `
  <div class="dl-overlay">
    <div class="dl-box">
      <div class="dl-inner">
        <div class="titlebar" style="height:28px;">
          <div class="hatch-v"></div>
          <div class="titlebar-label" id="dlTitleText">${dl.done ? 'Complete' : 'Copying'}</div>
          <div class="hatch-v"></div>
        </div>
        <div class="dl-bar">
          <div class="dl-file-row">
            <div class="dl-icon"></div>
            <div class="dl-file-text">
              <span>${esc(dl.file)}</span>
              <span id="dlStatusText">${dl.done ? 'Saved to Downloads' : 'Copying from Google Drive\u2026'}</span>
            </div>
          </div>
          <div class="dl-track"><div class="dl-fill" id="dlFill" style="width:${pct}%;background:repeating-linear-gradient(115deg,#111 0 4px,transparent 4px 8px),${dl.done ? 'oklch(0.80 0.17 148)' : 'oklch(0.85 0.14 196)'};"></div></div>
          <div class="dl-footer">
            <span class="dl-pct" id="dlPctText">${pct}% of 1 item</span>
            <button class="btn-clear" id="dlCancel">${dl.done ? 'OK' : 'Cancel'}</button>
          </div>
        </div>
      </div>
    </div>
  </div>`;
}

function renderEmptyShell_(){
  let msg;
  if (LOAD_ERROR) {
    msg = 'Could not load the shared sheet:\n' + esc(LOAD_ERROR);
  } else if (LAST_DIAGNOSTIC && LAST_DIAGNOSTIC.rawRowCount > 1 && LAST_DIAGNOSTIC.parsedCount === 0) {
    msg = 'Loaded ' + (LAST_DIAGNOSTIC.rawRowCount-1) + ' row(s), but none matched expected columns.\n\nHeader row found:\n' +
      LAST_DIAGNOSTIC.headers.map((h,i) => (i+1)+'. "'+esc(h)+'"').join('\n');
  } else if (LAST_DIAGNOSTIC && LAST_DIAGNOSTIC.rawRowCount <= 1) {
    msg = 'The sheet loaded fine but has no submitted rows yet.';
  } else {
    msg = 'Nothing logged yet.';
  }
  return `
  <div class="panel">
    <div class="panel-inner">
      <div class="titlebar">
        <div class="dot-box"><i></i></div>
        <div class="hatch-v"></div>
        <div class="titlebar-label">Best Calls</div>
        <div class="hatch-v"></div>
      </div>
      <div class="empty-state err">${msg}</div>
    </div>
  </div>`;
}

function bindEvents_(rows){
  const qEl = $('q');
  if (qEl) qEl.addEventListener('input', e => { state.query = e.target.value; render(); });

  document.querySelectorAll('.grade-chip').forEach(b => b.addEventListener('click', () => {
    toggleIn_(state.grades, b.getAttribute('data-grade')); render();
  }));
  document.querySelectorAll('.ind-chip').forEach(b => b.addEventListener('click', () => {
    toggleIn_(state.industries, b.getAttribute('data-ind')); render();
  }));
  document.querySelectorAll('.sortable').forEach(el => el.addEventListener('click', () => sortBy(el.getAttribute('data-sort'))));

  const toggleAll = $('toggleAll');
  if (toggleAll) toggleAll.addEventListener('click', () => {
    const allSelected = rows.length > 0 && rows.every(r => state.selected.has(r.link));
    if (allSelected) rows.forEach(r => state.selected.delete(r.link));
    else rows.forEach(r => state.selected.add(r.link));
    render();
  });

  document.querySelectorAll('[data-toggle]').forEach(el => el.addEventListener('click', e => {
    e.stopPropagation();
    const link = el.getAttribute('data-toggle');
    if (state.selected.has(link)) state.selected.delete(link); else state.selected.add(link);
    render();
  }));

  document.querySelectorAll('[data-open]').forEach(el => el.addEventListener('click', () => {
    state.openLink = el.getAttribute('data-open'); render();
  }));

  document.querySelectorAll('[data-download]').forEach(el => el.addEventListener('click', e => {
    e.stopPropagation();
    const link = el.getAttribute('data-download');
    const r = SOURCE_ROWS.find(x => x.link === link);
    if (r) startDownload(r);
  }));

  document.querySelectorAll('[data-remove]').forEach(el => el.addEventListener('click', () => {
    state.selected.delete(el.getAttribute('data-remove')); render();
  }));

  const clearSel = $('clearSel');
  if (clearSel) clearSel.addEventListener('click', () => { state.selected.clear(); render(); });

  const shareSet = $('shareSet');
  if (shareSet) shareSet.addEventListener('click', () => triggerShareDownloads(SOURCE_ROWS));

  const overlay = $('modalOverlay');
  if (overlay) overlay.addEventListener('click', () => { state.openLink = null; render(); });
  const modalBox = $('modalBox');
  if (modalBox) modalBox.addEventListener('click', e => e.stopPropagation());
  const closeModal = $('closeModal');
  if (closeModal) closeModal.addEventListener('click', () => { state.openLink = null; render(); });
  const modalDownload = $('modalDownload');
  if (modalDownload) modalDownload.addEventListener('click', () => {
    const r = SOURCE_ROWS.find(x => x.link === state.openLink);
    if (r) startDownload(r);
  });
  const modalToggle = $('modalToggle');
  if (modalToggle) modalToggle.addEventListener('click', () => {
    const link = state.openLink;
    if (state.selected.has(link)) state.selected.delete(link); else state.selected.add(link);
    render();
  });

  const dlCancel = $('dlCancel');
  if (dlCancel) dlCancel.addEventListener('click', cancelDownload);
}

app.innerHTML = '<div class="empty-state">loading…</div>';
loadFromSheet().then(render);

/* ======================= RETRO PIXEL CURSOR ======================= */
// Pure pixel-grid SVGs (no image files) so it matches the ink-black
// neo-brutalist look. '#' = filled pixel, '.' = transparent.
function pixelSvg_(pattern, cell){
  const rows = pattern.length;
  const cols = Math.max.apply(null, pattern.map(r => r.length));
  let rects = '';
  pattern.forEach((row, y) => {
    for (let x = 0; x < row.length; x++){
      if (row[x] === '#') rects += '<rect x="'+(x*cell)+'" y="'+(y*cell)+'" width="'+cell+'" height="'+cell+'"/>';
    }
  });
  const w = cols*cell, h = rows*cell;
  return '<svg xmlns="http://www.w3.org/2000/svg" width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" fill="#111">'+rects+'</svg>';
}

const ARROW_PATTERN = [
  '#...........',
  '##..........',
  '###.........',
  '####........',
  '#####.......',
  '######......',
  '#######.....',
  '########....',
  '#####.......',
  '##.##.......',
  '#..##.......',
  '....##......',
  '....##......',
  '.....##.....',
  '.....##.....',
  '......#.....',
];
// Two-frame pointing glove — index finger shifts down a row between frames
// to read as a little tap/flex while hovering something clickable.
const GLOVE_FRAME_A = [
  '....##......',
  '...#..#.....',
  '...#..#.....',
  '...#..#.....',
  '..##..##....',
  '.#..####....',
  '#.#.#..#....',
  '#..#...#....',
  '.#......#...',
  '.#......#...',
  '..#......#..',
  '..########..',
];
const GLOVE_FRAME_B = [
  '............',
  '....##......',
  '...#..#.....',
  '...#..#.....',
  '..##..##....',
  '.#..####....',
  '#.#.#..#....',
  '#..#...#....',
  '.#......#...',
  '.#......#...',
  '..#......#..',
  '..########..',
];

const CELL = 3;
const ARROW_SVG = pixelSvg_(ARROW_PATTERN, CELL);
const GLOVE_SVGS = [pixelSvg_(GLOVE_FRAME_A, CELL), pixelSvg_(GLOVE_FRAME_B, CELL)];
const INTERACTIVE_SELECTOR = 'button, a, input, select, textarea, .chip, .checkbox-box, ' +
  '[data-open], [data-toggle], [data-download], [data-remove]';

(function initPixelCursor(){
  const el = document.getElementById('pixelCursor');
  if (!el) return;
  el.innerHTML = ARROW_SVG;
  let hovering = false;
  let animTimer = null;
  let frame = 0;

  function startHoverAnim(){
    if (animTimer) return;
    frame = 0;
    el.innerHTML = GLOVE_SVGS[frame];
    animTimer = setInterval(() => {
      frame = 1 - frame;
      el.innerHTML = GLOVE_SVGS[frame];
    }, 220);
  }
  function stopHoverAnim(){
    clearInterval(animTimer); animTimer = null;
    el.innerHTML = ARROW_SVG;
  }

  document.addEventListener('mousemove', e => {
    el.style.transform = 'translate(' + e.clientX + 'px,' + e.clientY + 'px)';
    // pointer-events:none on the cursor itself, so this always finds the
    // real element underneath rather than the cursor overlay
    const target = document.elementFromPoint(e.clientX, e.clientY);
    const isHover = !!(target && target.closest(INTERACTIVE_SELECTOR));
    if (isHover && !hovering) { hovering = true; startHoverAnim(); }
    else if (!isHover && hovering) { hovering = false; stopHoverAnim(); }
  });
  document.addEventListener('mouseleave', () => { el.style.display = 'none'; });
  document.addEventListener('mouseenter', () => { el.style.display = 'block'; });
})();
</script>
